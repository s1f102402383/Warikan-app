services:
  app:
    build:
      context: .
      dockerfile: build/Dockerfile
    container_name: app
    volumes:
      - ./src:/app/src
    environment:
      OCR_SECRET_KEY : "個々に設定する必要があります"
      MySQL_HOST: "mariadb"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"
    ports:
      - 8800:8800

  mariadb:
    image: mariadb:10.6
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:cached
